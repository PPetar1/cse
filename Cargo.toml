[package]
name = "cse"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.15"
hexx = { version = "0.23.0", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.44", features = ["serde", "parsing", "formatting"] }
toml = "0.9.8"
