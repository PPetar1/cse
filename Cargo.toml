[package]
name = "cse"
version = "0.1.0"
edition = "2024"

# No debug info for the ~700 dependency crates (Bevy et al.) — this keeps
# target/ from ballooning to >10 GB. Our own code keeps full debug info.
[profile.dev.package."*"]
debug = false

[dependencies]
bevy = "0.15"
# default-features off: this drops the wgpu backend, which doesn't present
# frames in our sandboxed dev VM (window opens, renders nothing — confirmed
# with debug logging showing render calls firing correctly). glow (OpenGL,
# via Mesa/llvmpipe here) renders correctly in the same environment and is
# plenty for a 2D immediate-mode UI with no need for wgpu's extra features.
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
egui = "0.35.0"
hexx = { version = "0.23.0", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.9"
rustyline = "18.0.1"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.44", features = ["serde", "parsing", "formatting"] }
toml = "0.9.8"
